# ==============================================================================
# Kaggle 2xT4 DDP Config: VisDrone YOLOv11 + Slot FiLM + Deformable High-Res Micro-Patch
# - `cache_images: null` uses LMDB mmap OS page cache (0 RAM duplication across DDP workers)
# - `batch_size: 8` x 2 GPUs x `accumulate: 2` = effective batch size 32 (safe for 15GB T4 VRAM)
# ==============================================================================

work_dir: "./work_dirs/visdrone_deformable_slot_kaggle"
device: "cuda"
seed: 42
tqdm: true

custom_imports:
  - "VisDrone_deformable_slot.model"
  - "VisDrone_deformable_slot.dataset"
  - "VisDrone_yolov11.loss"
  - "VisDrone_yolov11.metrics"

# 1. Model Configuration
model:
  type: "VisDroneYOLO11DeformableSlot"
  num_classes: 10
  pretrained: "/kaggle/input/models/royalb26/yolov11/pytorch/default/1/yolo11n.pt"
  box_weight: 7.5
  cls_weight: 1.0
  dfl_weight: 1.5
  focal_alpha: -1.0
  focal_gamma: 0.0
  conf_threshold: 0.05
  nms_threshold: 0.5
  max_det: 300
  # Dual-Resolution & Deformable High-Res Micro-Patch Injector (Approach 2)
  backbone_size: 640
  use_deformable_patch: true
  num_patches: 192
  patch_size: 32                 # 32x32 RGB micro-patch (preserves ~100% sharpness; divides cleanly 32->16->8->4)
  base_patch_radius: 0.035       # 45x45px span on 1280x1280 (dynamic 27x27..63x63px covering Tiny->Small p90)
  max_offset_cells: 1.5
  class_focus_weights: [2.0, 2.0, 3.0, 0.3, 0.5, 0.5, 3.0, 3.0, 0.3, 2.0]
  spread_local_3x3: true
  patch_dropout: 0.1
  # Slot + FiLM hyperparameters
  slot_dim: 64
  num_prototypes: [2, 2, 2, 1, 2, 3, 3, 3, 2, 2]
  num_iters: 2
  use_implicit_diff: true
  use_cosine_attn: true
  fusion_mode: "film"
  use_bg_slot_write: false
  use_logit_prior: false
  assigner_prior_weight: 0.25
  use_slot_checkpoint: false
  slot_loss_weight: 0.3
  bg_attn_weight: 0.3
  fg_attn_weight: 0.7
  suppress_weight: 0.05
  cls_attn_weight: 0.8
  ortho_weight: 0.1
  slot_dropout: 0.1
  use_asa_gate: true
  asa_gate_floor: 0.05
  asa_logit_weight: 0.25
  asa_topk: 16
  presence_hidden_dim: 32
  presence_dropout: 0.3
  presence_loss_weight: 0.25
  presence_label_smoothing: 0.05
  sparse_thresh: 0.05
  use_overlap_soft_target: true
  use_ellipse_mask: true
  ellipse_min_side: 3.0
  use_class_freq_weight: true
  class_freq_max_weight: 2.0

# 2. Dual-Resolution Dataset Configuration (update data_root to your Kaggle LMDB dataset path)
data:
  train:
    dataset:
      type: "VisDroneDualResLMDBDataset"
      data_root: "/content/train_data.lmdb"
      cache_images: null         # CRITICAL for Kaggle DDP: avoids forkserver RAM duplication (SIGKILL -9)
      seed: 42
      num_classes: 10
      include_boxes: true
      augment: true
      mosaic_prob: 0.5
      mosaic_rare_prob: 0.75
      pipeline:
        - type: "Resize"
          size: [1280, 1280]
        - type: "ToTensor"
    batch_size: 8                # 8 per T4 x 2 GPUs x accumulate 2 = effective batch 32
    shuffle: true
    num_workers: 2
    pin_memory: true
  val:
    dataset:
      type: "VisDroneDualResLMDBDataset"
      data_root: "/content/val_data.lmdb"
      cache_images: null
      seed: 42
      num_classes: 10
      include_boxes: true
      augment: false
      pipeline:
        - type: "Resize"
          size: [1280, 1280]
        - type: "ToTensor"
    batch_size: 8
    shuffle: false
    num_workers: 2
    pin_memory: true

# 3. Optimizer & Scheduler
optimizer:
  type: "AdamW"
  lr: 0.0012
  weight_decay: 0.001

lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

# 4. Metrics
metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10

# 5. Training Hyperparameters
train_cfg:
  max_epochs: 100
  val_interval: 10
  grad_clip: 10.0
  use_amp: true
  accumulate: 2
  log_interval: 50000

# 6. Lifecycle Hooks
hooks:
  - type: "WarmupLRHook"
    warmup_epochs: 3
    start_factor: 0.05
    disable_mosaic_warmup: true
  - type: "CloseMosaicHook"
    close_epochs: 15
  - type: "CheckpointHook"
    interval: 1
    save_best: "mAP_50"
    mode: "max"
  - type: "ExcelTracker"
    filename: "training_metrics.xlsx"
    track_gradients: true
    grad_interval: 1
    track_detection: true
    detection_interval: 5
    auto_save: true
    resume: true
    submodules: null
