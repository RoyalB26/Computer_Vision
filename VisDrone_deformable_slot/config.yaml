# ==============================================================================
# Local Config: VisDrone YOLOv11 + Slot FiLM + Deformable High-Res Micro-Patch
# ==============================================================================

work_dir: "./work_dirs/visdrone_deformable_slot_local"
device: "cuda"
seed: 42
tqdm: true

custom_imports:
  - "VisDrone_deformable_slot.model"
  - "VisDrone_deformable_slot.dataset"
  - "VisDrone_yolov11.loss"
  - "VisDrone_yolov11.metrics"

model:
  type: "VisDroneYOLO11DeformableSlot"
  num_classes: 10
  pretrained: "yolo11n.pt"
  box_weight: 7.5
  cls_weight: 1.0
  dfl_weight: 1.5
  focal_alpha: -1.0
  focal_gamma: 0.0
  conf_threshold: 0.05
  nms_threshold: 0.001
  max_det: 300
  # Dual-Resolution & Deformable High-Res Micro-Patch Injector (Approach 2)
  backbone_size: 960
  use_deformable_patch: true
  num_patches: 192
  patch_size: 32
  base_patch_radius: 0.035
  max_offset_cells: 1.5
  class_focus_weights: [2.0, 2.0, 3.0, 0.3, 1.2, 1.5, 3.0, 3.0, 0.8, 2.0]
  spread_local_3x3: true
  patch_dropout: 0.1
  patch_loss_weight: 0.2
  use_uncertainty_routing: true
  uncertainty_floor: 0.2
  use_sparse_subhead: true
  # Slot + FiLM hyperparameters
  slot_dim: 64
  num_prototypes: [2, 2, 2, 1, 2, 3, 3, 3, 2, 2]
  num_iters: 1
  use_implicit_diff: true
  use_cosine_attn: true
  fusion_mode: "film"
  use_bg_slot_write: false
  use_logit_prior: false
  assigner_prior_weight: 0.25
  use_slot_checkpoint: false
  slot_loss_weight: 0.3
  bg_attn_weight: 0.3
  fg_attn_weight: 0.7
  suppress_weight: 0.05
  cls_attn_weight: 0.8
  ortho_weight: 0.1
  slot_dropout: 0.1
  use_asa_gate: true
  asa_gate_floor: 0.05
  asa_logit_weight: 0.25
  asa_topk: 16
  presence_hidden_dim: 32
  presence_dropout: 0.3
  presence_loss_weight: 0.25
  presence_label_smoothing: 0.05
  sparse_thresh: 0.05
  use_overlap_soft_target: true
  use_ellipse_mask: true
  ellipse_min_side: 3.0
  use_class_freq_weight: true
  class_freq_max_weight: 2.0

data:
  train:
    dataset:
      type: "VisDroneDualResLMDBDataset"
      data_root: "D:/apps/Datasets/VisDrone/train_data.lmdb"
      seed: 42
      num_classes: 10
      include_boxes: true
      augment: true
      mosaic_prob: 0.5
      mosaic_rare_prob: 0.75
      pipeline:
        - type: "Resize"
          size: [1280, 1280]
        - type: "ToTensor"
    batch_size: 4
    shuffle: true
    num_workers: 4
  val:
    dataset:
      type: "VisDroneDualResLMDBDataset"
      data_root: "D:/apps/Datasets/VisDrone/val_data.lmdb"
      seed: 42
      num_classes: 10
      include_boxes: true
      augment: false
      pipeline:
        - type: "Resize"
          size: [1280, 1280]
        - type: "ToTensor"
    batch_size: 4
    shuffle: false
    num_workers: 2

optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.001

lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10

train_cfg:
  max_epochs: 100
  val_interval: 10
  grad_clip: 10.0
  use_amp: true
  accumulate: 4
  log_interval: 50000

hooks:
  - type: "WarmupLRHook"
    warmup_epochs: 3
    start_factor: 0.05
    disable_mosaic_warmup: true
  - type: "CloseMosaicHook"
    close_epochs: 15
  - type: "CheckpointHook"
    interval: 5
    save_best: "mAP_50"
    mode: "max"
