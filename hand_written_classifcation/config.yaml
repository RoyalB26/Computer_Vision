work_dir: "./work_dirs/handwritten_conv_exp1"
device: "cuda"
tqdm: true
custom_imports:
  - "hand_written_classifcation.dataset"
  - "hand_written_classifcation.model"

model:
  type: "SimpleConvClassifier"
  in_channels: 3
  num_classes: 62
  target_size: [28, 28]
  use_downsample: true
  loss_weight: 1.0

data:
  train:
    dataset:
      type: "LMDBHandwrittenDataset"
      lmdb_path: "D:/apps/Datasets/Hand_Digit/Dataset/combined_folder/train.lmdb"
      num_classes: 62
      pipeline:
        - type: "ToTensor"
        - type: "Resize"
          size: [512, 512]
    batch_size: 32
    shuffle: true
    num_workers: 0

  val:
    dataset:
      type: "LMDBHandwrittenDataset"
      lmdb_path: "D:/apps/Datasets/Hand_Digit/Dataset/combined_folder/test.lmdb"
      num_classes: 62
      pipeline:
        - type: "ToTensor"
        - type: "Resize"
          size: [512, 512]
    batch_size: 32
    shuffle: false
    num_workers: 0

optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

metrics:
  acc:
    type: "Accuracy"
    topk: [1, 5]

train_cfg:
  max_epochs: 50
  val_interval: 5
  log_interval: 200
