# Configuration for VisDrone Object Detection WITHOUT Slot Attention
work_dir: "./work_dirs/visdrone_no_slot"
device: "cuda"  
seed: 42
tqdm: true
accumulate: 1

custom_imports:
  - "Visdrone_no_slot.model"
  - "Visdrone_no_slot.dataset"
  - "Visdrone_no_slot.metrics"

# 1. Model Configuration: Standard MobileNetV3 FPN Detector (No Slot)
model:
  type: "VisDroneDetectorNoSlot"
  num_classes: 10
  dim: 72
  images_size: 640

# 2. Dataset Configuration
data:
  train:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "/content/visdron.lmdb"
      split: "train"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 64
    shuffle: true
    num_workers: 2

  val:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "/content/visdron.lmdb"
      split: "val"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 64
    shuffle: false
    num_workers: 0

# 3. Optimizer Configuration
optimizer:
  type: "AdamW"
  lr: 0.0005
  weight_decay: 0.0001

# 4. LR Scheduler Configuration
lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10
    box_format: "cxcywh"

hooks:
  - type: "ExcelTracker"
    filename: "training_metrics.xlsx"
    track_gradients: true
    grad_interval: 1
    submodules: null

# 5. Training Engine Configuration
train_cfg:
  max_epochs: 100
  val_interval: 5
  log_interval: 200
  grad_clip: 0.5
  use_amp: true
