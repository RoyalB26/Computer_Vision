# Configuration for COCO Object Detection (Boxes + Labels) with mAP (50, 75, 50:95) Evaluation

work_dir: "./work_dirs/hand_digit_detection"
device: "cuda"  
seed: 42
tqdm: true

custom_imports:
  - "hand_digit_detect.model"
  - "hand_digit_detect.dataset"

# 1. Model Configuration: Modular Object Detector
model:
  type: "Hand_Digit_Detector"
  num_classes: 80
  dim: 16
  total_head: 4
  images_size: 640
  num_ref: 4

# 2. Dataset Configuration (Đọc dataset từ Coco/ với task="detection")
data:
  train:
    dataset:
      type: "Hand_Digit_LMDBDataset"
      data_root: "D:/apps/Datasets/Hand_Digit/train_data.lmdb"
      split: "train"
      split_ratio: 0.8
      num_classes: 80
      task: "detection"
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 8
    shuffle: true
    num_workers: 0
    collate_fn:
      type: "DetectionCollate"

  val:
    dataset:
      type: "Hand_Digit_LMDBDataset"
      data_root: "D:/apps/Datasets/Hand_Digit/train_data.lmdb"
      split: "val"
      split_ratio: 0.8
      num_classes: 80
      task: "detection"
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 8
    shuffle: false
    num_workers: 0
    collate_fn:
      type: "DetectionCollate"

# 3. Optimizer Configuration
optimizer:
  type: "AdamW"
  lr: 0.0005
  weight_decay: 0.0001

# 4. LR Scheduler Configuration

# 5. Metrics Configuration: mAP Evaluation (mAP_50, mAP_75, mAP_50:95)
metrics:
  mAP:
    type: "MeanAveragePrecision"
    num_classes: 80
hooks:
  - type: "ExcelTracker"
    filename: "training_metrics.xlsx"       # File sẽ được lưu trong thư mục work_dir
    track_gradients: true                   # Bật tracking gradient chi tiết
    grad_interval: 1                        # Chu kỳ lấy mẫu gradient (mỗi 1 batch)
    submodules: null
# 6. Training Engine Configuration
train_cfg:
  max_epochs: 1
  val_interval: 5
  log_interval: 2500
  grad_clip: 1.0
  use_amp: false
