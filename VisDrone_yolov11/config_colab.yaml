# ==============================================================================
# VisDrone YOLOv11 + Post-Neck Decoupled Slot Attention & FiLM (Method B+C, 960x960)
# ==============================================================================

work_dir: "./work_dirs/visdrone_yolov11_slot_960"
device: "cuda"
seed: 42
tqdm: true

custom_imports:
  - "VisDrone_yolov11.model"
  - "VisDrone_yolov11.dataset"
  - "VisDrone_yolov11.loss"
  - "VisDrone_yolov11.metrics"

# 1. Model Configuration: YOLOv11 + Post-Neck Decoupled Slot + FiLM (B+C)
model:
  type: "VisDroneYOLO11Slot"
  num_classes: 10
  pretrained: "/content/yolo11n.pt"
  # Core YOLOv11 detection loss weights
  box_weight: 7.5
  cls_weight: 1.0
  dfl_weight: 1.5
  focal_alpha: -1.0
  focal_gamma: 0.0
  # Inference thresholds
  conf_threshold: 0.05
  nms_threshold: 0.5
  max_det: 300
  # Slot + FiLM (Method B+C) hyperparameters
  slot_dim: 64                 # 64 dim gives sub-slots plenty of orthogonal freedom
  # Per-class prototypes: [ped, people, bicycle, car, van, truck, tricycle, awning-tri, bus, moto] -> 22 FG + 1 BG = 23 slots
  num_prototypes: [2, 2, 2, 1, 2, 3, 3, 3, 2, 2]
  num_iters: 2                 # MUFASA Coarse-to-Fine T=2 (Iter 1: P4+P5 -> detach -> Iter 2: P3+P4+P5)
  use_implicit_diff: true      # 1-Step Implicit Diff (detach coarse slots to save VRAM & stabilize grad)
  use_cosine_attn: true        # Cosine Attention (locks ||q_bg||==||q_fg||==1, prevents logit explosion & BG dominance)
  fusion_mode: "film"          # "film" (Method C) or "residual"
  use_bg_slot_write: false     # false = FG slots only (natural bg gating), true = all slots
  use_logit_prior: false       # keep head.cv3 clean (no logit co-adaptation)
  assigner_prior_weight: 0.25   
  use_slot_checkpoint: false   # set true to further cut activation VRAM on small GPUs
  slot_loss_weight: 0.3        # auxiliary slot supervision multiplier
  bg_attn_weight: 0.3
  fg_attn_weight: 0.7
  suppress_weight: 0.05
  cls_attn_weight: 0.8
  ortho_weight: 0.1
  slot_dropout: 0.1
  # Compact Anti-Overfit ASA Presence Gate (proj_in GAP + Top-K Mean, ~13K params)
  use_asa_gate: true
  asa_gate_floor: 0.05         # soft floor so tiny small objects are never hard-killed
  asa_logit_weight: 0.25       # gentle logit bias in dots_sub (full gating in slot_broadcast)
  asa_topk: 16                 # Top-K Mean Pooling (resists single-pixel outlier spikes vs GMP)
  presence_hidden_dim: 32      # compact bottleneck (~13.4K params vs 116K)
  presence_dropout: 0.3
  presence_loss_weight: 0.25
  presence_label_smoothing: 0.05
  sparse_thresh: 0.05          # prune tiny background tails in attn_norm
  # cls_attn target & imbalance refinements
  use_overlap_soft_target: true   # soft target normalization on overlapping pixels (motorcycle <-> people)
  use_ellipse_mask: true          # inscribed ellipse mask for large boxes (>= 3x3 cells) to cut truck BG leak
  ellipse_min_side: 3.0
  use_class_freq_weight: true     # gentle EMA inverse-sqrt class-frequency weighting in [1.0, 2.0]
  class_freq_max_weight: 2.0
# 2. Dataset Configuration (Stratified Split synced with Visdrone/dataset.py)
data:
  train:
    dataset:
      type: "VisDroneLMDBDataset"
      data_root: "/content/train_data.lmdb"
      cache_images: "ram"
      seed: 42
      num_classes: 10
      include_boxes: true
      augment: true
      mosaic_prob: 0.5             # 4-image Mosaic augmentation (disabled in final 15 epochs via CloseMosaicHook)
      mosaic_rare_prob: 0.5        # 50% of Mosaic samples inject 1 rare-class image (auto-detected < 35% freq)
      pipeline:
        - type: "Resize"
          size: [960, 960]
        - type: "ToTensor"
    batch_size: 32
    shuffle: true
    num_workers: 4
    pin_memory: true
  val:
    dataset:
      type: "VisDroneLMDBDataset"
      data_root: "/content/val_data.lmdb"
      cache_images: "ram"
      seed: 42
      num_classes: 10
      include_boxes: true
      augment: false
      pipeline:
        - type: "Resize"
          size: [960, 960]
        - type: "ToTensor"
    batch_size: 32
    shuffle: false
    num_workers: 2
    pin_memory: true

# 3. Optimizer Configuration
optimizer:
  type: "AdamW"
  lr: 0.0012
  weight_decay: 0.001

# 4. Learning Rate Scheduler
lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

# 5. Metrics Configuration: mAP Evaluation
metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10

# 6. Training Hyperparameters
train_cfg:
  max_epochs: 100
  val_interval: 10
  grad_clip: 10.0
  use_amp: true
  accumulate: 1                # effective batch size = 8 * 2 = 16
  log_interval: 50000
# 7. Lifecycle Hooks
hooks:
  - type: "CloseMosaicHook"
    close_epochs: 15                        # Tắt Mosaic 15 epoch cuối để hội tụ về phân phối ảnh thật
  - type: "CheckpointHook"
    interval: 1
    save_best: "mAP_50"
    mode: "max"
  - type: "ExcelTracker"
    filename: "training_metrics.xlsx"       # Lưu trực tiếp vào thư mục work_dir
    track_gradients: true                   # Bật tracking gradient chi tiết
    grad_interval: 1                        # Chu kỳ lấy mẫu gradient (mỗi 1 batch)
    track_detection: true                   # Bật tracking tab Detection phân tích động lực học mô hình
    detection_interval: 5                   # Chu kỳ lấy mẫu phân tích detection (mỗi 5 batch)
    auto_save: true                         # Tự động ghi ra file Excel sau mỗi epoch
    resume: true                            # Tự động tiếp tục ghi tiếp vào sheet nếu file đã tồn tại
    submodules: null
