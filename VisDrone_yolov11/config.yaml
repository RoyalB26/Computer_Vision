# ==============================================================================
# VisDrone YOLOv11 Configuration (DIoU Loss + Focal Loss)
# ==============================================================================

work_dir: "./work_dirs/visdrone_yolov11"
device: "cuda"
seed: 42
tqdm: true

custom_imports:
  - "VisDrone_yolov11.model"
  - "VisDrone_yolov11.dataset"
  - "VisDrone_yolov11.loss"
  - "VisDrone_yolov11.metrics"

# 1. Model Configuration: YOLOv11 Detector with DIoU & Focal Loss
model:
  type: "VisDroneYOLO11"
  num_classes: 10
  pretrained: "yolo11n.pt"     # Automatic transfer learning from yolo11n.pt
  box_weight: 7.5             # Weight for DIoU regression loss
  cls_weight: 1.0             # Weight for Sigmoid Focal Loss
  dfl_weight: 1.5             # Weight for Distribution Focal Loss
  focal_alpha: 0.25           # Alpha balancing factor for Focal Loss
  focal_gamma: 2.0            # Focusing parameter for hard examples
  conf_threshold: 0.05        # Score threshold for inference & evaluation
  nms_threshold: 0.5          # IoU threshold for Batched NMS
  max_det: 300                # Maximum detections per image

# 2. Dataset Configuration
data:
  train:
    dataset:
      type: "VisDroneLMDBDataset"
      data_root: "D:/apps/Datasets/VisDrone/VisDrone_data.lmdb"   # Override via CLI --cfg-options data.train.dataset.data_root=...
      split: "train"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 16
    shuffle: true
    num_workers: 4

  val:
    dataset:
      type: "VisDroneLMDBDataset"
      data_root: "D:/apps/Datasets/VisDrone/VisDrone_data.lmdb"   # Override via CLI --cfg-options data.val.dataset.data_root=...
      split: "val"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 16
    shuffle: false
    num_workers: 2

# 3. Optimizer Configuration
optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0005

# 4. Learning Rate Scheduler
lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

# 5. Metrics Configuration: mAP Evaluation
metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10

# 6. Training Hyperparameters
train_cfg:
  max_epochs: 100
  val_interval: 1
  grad_clip: 10.0
  use_amp: true
  accumulate: 1

# 7. Lifecycle Hooks
hooks:
  - type: "LoggerHook"
    interval: 50
  - type: "CheckpointHook"
    interval: 1
    save_best: "mAP_50"
    mode: "max"
