# Configuration for VisDrone Object Counting using Attention Slot

work_dir: "./work_dirs/visdrone_counting"
device: "cuda"  
seed: 42
tqdm: true

custom_imports:
  - "Visdrone.model"
  - "Visdrone.dataset"
  - "Visdrone.metrics"
  - "Visdrone.tracker"

# 1. Model Configuration: Attention Slot Class Counter with Flat BG Filter Mask
model:
  type: "VisDroneDetector"
  num_classes: 10
  dim: 256
  stride: 1
  exp_factor: 5.0
  count_loss_weight: 1.0
  bg_attn_weight: 1.0
  fg_attn_weight: 1.0
  suppress_weight: 0.1

# 2. Dataset Configuration
data:
  train:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "D:/apps/Datasets/VisDrone/train_data.lmdb"
      split: "train"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [960, 960]
        - type: "ToTensor"
    batch_size: 4
    shuffle: true
    num_workers: 1

  val:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "D:/apps/Datasets/VisDrone/train_data.lmdb"
      split: "val"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [960, 960]
        - type: "ToTensor"
    batch_size: 4
    shuffle: false
    num_workers: 1

# 3. Optimizer Configuration
optimizer:
  type: "AdamW"
  lr: 0.0005
  weight_decay: 0.0001

# 4. LR Scheduler Configuration
lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

# 5. Metrics Configuration: Class Counting Evaluation (MAE, RMSE, Acc)
metrics:
  counting:
    type: "ClassCountingMetric"
    num_classes: 10

# 6. Tracking & Lifecycle Hooks
hooks:
  - type: "ExcelTracker"
    filename: "training_metrics.xlsx"
    track_gradients: true
    grad_interval: 50
    track_detection: false
    auto_save: true
    resume: true
    submodules:
      - "backbone"
      - "proj_p3"
      - "proj_p4"
      - "proj_p5"
      - "slot_attention"
      - "slot_attention.to_q"
      - "slot_attention.to_k"
      - "slot_attention.to_v"
      - "slot_attention.FC1"
      - "slot_attention.FC2"
      - "slot_attention.fc1"
      - "slot_attention.fc2"
      - "fc_actor"

  - type: "CheckpointHook"
    interval: 1
    save_best: "val_mae"
    mode: "min"
    max_keep_ckpts: 5
    filename_tmpl: "epoch_{}.pth"

# 7. Training Engine Configuration
train_cfg:
  max_epochs: 100
  val_interval: 5
  log_interval: 20000
  grad_clip: 5.0
  use_amp: false
  accumulate : 8
