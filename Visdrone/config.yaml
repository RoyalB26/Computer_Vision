# Configuration for VisDrone Object Detection

work_dir: "./work_dirs/visdrone_detection"
device: "cuda"  
seed: 42
tqdm: true
accumulate: 1

custom_imports:
  - "Visdrone.model"
  - "Visdrone.dataset"
  - "Visdrone.metrics"
  - "Visdrone.tracker"

# 1. Model Configuration: Modular VisDrone Detector with FPN
model:
  type: "VisDroneDetector"
  num_classes: 10
  dim: 32
  total_head: 4
  images_size: 640
  num_ref: 16
# 2. Dataset Configuration
data:
  train:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "/content/visdron.lmdb"
      split: "train"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 32
    shuffle: true
    num_workers: 8

  val:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "/content/visdron.lmdb"
      split: "val"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 32
    shuffle: false
    num_workers: 4
optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

# 4. LR Scheduler Configuration
lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10
    box_format: "cxcywh"
hooks:
  - type: "ExcelTracker"
    filename: "training_metrics_visdrone.xlsx"       # File sẽ được lưu trong thư mục work_dir
    track_gradients: true                   # Bật tracking gradient chi tiết
    grad_interval: 1                        # Chu kỳ lấy mẫu gradient (mỗi 1 batch)
    track_detection: true                   # Bật tracking tab Detection phân tích cls_logits & pred_offsets
    detection_interval: 10                  # Chu kỳ lấy mẫu phân tích detection (mỗi 10 batch)
    submodules:
      # 1. Trích xuất đặc trưng & Khởi tạo (Backbone, Projector, Stem)
      - "backbone"
      - "projector"
      - "conv2"

      # 2. PANet Không gian đa tỷ lệ (Multi-scale Spatial Highway)
      - "downsample"
      - "downsample.fuse1"                  # Tầng 80x80
      - "downsample.fuse2"                  # Tầng 40x40
      - "downsample.fuse3"                  # Tầng 20x20
      - "up_sample"
      - "up_sample.conv1"                   # Tái tạo 40x40
      - "up_sample.conv2"                   # Tái tạo 80x80
      - "up_sample.conv3"                   # Tái tạo 160x160

      # 3. Cơ chế Slot Attention & Slot Cross-Attention
      - "to_q"
      - "to_k"
      - "to_v"
      - "fc1"
      - "fc2"
      - "cross_attn"
      - "cross_attn.q_proj"
      - "cross_attn.out_proj"

      # 4. Deformable Attention & Bộ sinh tọa độ Reference Points
      - "deformable"
      - "deformable.ref_mlp"                 # MLP dự đoán tọa độ K điểm reference
      - "deformable.to_q"                    # Slot Query projection
      - "deformable.to_k"                    # Sampled Key projection
      - "deformable.to_v"                    # Sampled Value projection

      # 5. Detection Heads (Phân loại & Hồi quy Bounding Box)
      - "head.cls_head"                     # Toàn bộ nhánh Class Head
      - "head.cls_head.6"                   # Lớp Conv 1x1 dự đoán heatmap logits
      - "head.box_head"                     # Toàn bộ nhánh Box Head
      - "head.box_head.6"                   # Lớp Conv 1x1 dự đoán offsets [dx, dy, w, h]

# 5. Training Engine Configuration
train_cfg:
  max_epochs: 100
  val_interval: 10
  log_interval: 500
  grad_clip: 1.0
  use_amp: false


