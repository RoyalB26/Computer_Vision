# Configuration for VisDrone Object Detection

work_dir: "./work_dirs/visdrone_detection"
device: "cuda"  
seed: 42
tqdm: true
accumulate: 1

custom_imports:
  - "Visdrone.model"
  - "Visdrone.dataset"
  - "Visdrone.metrics"

# 1. Model Configuration: Modular VisDrone Detector with FPN
model:
  type: "VisDroneDetector"
  num_classes: 10
  dim: 32
  total_head: 4
  images_size: 640
  num_ref: 16
# 2. Dataset Configuration
data:
  train:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "/content/visdron.lmdb"
      split: "train"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 32
    shuffle: true
    num_workers: 8

  val:
    dataset:
      type: "CustomLMDBDataset"
      data_root: "/content/visdron.lmdb"
      split: "val"
      split_ratio: 0.8
      seed: 42
      pipeline:
        - type: "Resize"
          size: [640, 640]
        - type: "ToTensor"
    batch_size: 32
    shuffle: false
    num_workers: 4
optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

# 4. LR Scheduler Configuration
lr_scheduler:
  type: "CosineAnnealingLR"
  T_max: 100
  eta_min: 0.00001

metrics:
  mAP:
    type: "VisDroneMAP"
    num_classes: 10
    box_format: "cxcywh"
hooks:
  - type: "ExcelTracker"
    filename: "training_metrics_visdrone.xlsx"       # File sẽ được lưu trong thư mục work_dir
    track_gradients: true                   # Bật tracking gradient chi tiết
    grad_interval: 1                        # Chu kỳ lấy mẫu gradient (mỗi 1 batch)
    submodules:
      - "backbone"
      - "downsample"
      - "up_sample"
      - "cross_attn"
      - "deformable"
      - "conv2"
      - "head.cls_head"
      - "head.box_head"

# 5. Training Engine Configuration
train_cfg:
  max_epochs: 100
  val_interval: 10
  log_interval: 500
  grad_clip: 1.0
  use_amp: false


